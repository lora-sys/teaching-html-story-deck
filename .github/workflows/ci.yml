name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static check
        run: python scripts/static_check.py

      - name: Validate bundled example
        run: python scripts/validate_deck.py examples/shapeup-skill-linear-vercel-deck.html

      - name: Verify scripts are executable
        run: |
          test -x scripts/static_check.py
          test -x scripts/validate_deck.py
          test -x scripts/init_deck.py
          echo 'All scripts executable'

  lint-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check README references
        run: |
          test -f README.md || (echo 'README.md missing' && exit 1)
          test -f SKILL.md || (echo 'SKILL.md missing' && exit 1)
          echo 'Core files present'

      - name: Check CHANGELOG
        run: |
          test -f CHANGELOG.md || (echo 'CHANGELOG.md missing' && exit 1)
          echo 'Changelog present'
