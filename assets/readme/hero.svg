<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Teaching HTML Story Deck</title>
  <desc id="hero-desc">Hero section: problem-first narrative skill for agent-powered teaching HTML decks with content-specific SVG diagrams and restrained motion.</desc>

  <defs>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1116"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg-grad)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#7ee787" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Left accent bar -->
  <rect x="48" y="48" width="3" height="264" rx="1.5" fill="url(#accent-grad)" opacity="0.6"/>

  <!-- Title block -->
  <g id="title-block" transform="translate(72, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#7ee787" letter-spacing="2">AGENT SKILL</text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="42" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">Teaching HTML</text>
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="42" font-weight="700" fill="url(#accent-grad)" letter-spacing="-0.5">Story Deck</text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="400" fill="#8b949e" letter-spacing="0.3">Problem-first narrative · Content-specific SVG · Restrained motion</text>

    <!-- Keywords row -->
    <g transform="translate(0, 178)">
      <rect x="0" y="0" width="120" height="30" rx="6" fill="#7ee787" opacity="0.1" stroke="#7ee787" stroke-width="0.8"/>
      <text x="60" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7ee787" text-anchor="middle">npx skills add</text>

      <rect x="136" y="0" width="80" height="30" rx="6" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="178" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b949e" text-anchor="middle">MIT License</text>

      <rect x="232" y="0" width="64" height="30" rx="6" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="264" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b949e" text-anchor="middle">v1.0.0</text>
    </g>
  </g>

  <!-- Right: Workflow diagram -->
  <g id="workflow-diagram" transform="translate(620, 40)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="1.5">WORKFLOW</text>

    <!-- Step boxes -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">Raw content</text>
    </g>
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">Narrative spine</text>
    </g>
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">Visual mapping</text>
    </g>
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">Inline SVG</text>
    </g>
    <g transform="translate(0, 216)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">Motion system</text>
    </g>
    <!-- Final output with accent -->
    <g transform="translate(0, 264)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#7ee787" opacity="0.1" stroke="#7ee787" stroke-width="1.2"/>
      <text x="12" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7ee787" font-weight="600">Standalone HTML</text>
    </g>

    <!-- Arrows -->
    <g stroke="#30363d" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
      <line x1="80" y1="36" x2="80" y2="72"/>
      <line x1="80" y1="108" x2="80" y2="120"/>
      <line x1="80" y1="156" x2="80" y2="168"/>
      <line x1="80" y1="204" x2="80" y2="216"/>
      <line x1="80" y1="252" x2="80" y2="264"/>
    </g>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#30363d"/>
      </marker>
    </defs>

    <!-- Side labels -->
    <g transform="translate(176, 48)">
      <circle cx="8" cy="8" r="3" fill="#7ee787" opacity="0.4"/>
      <text x="18" y="12" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">no build step</text>
    </g>
    <g transform="translate(176, 96)">
      <circle cx="8" cy="8" r="3" fill="#7ee787" opacity="0.4"/>
      <text x="18" y="12" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">content-specific</text>
    </g>
    <g transform="translate(176, 144)">
      <circle cx="8" cy="8" r="3" fill="#7ee787" opacity="0.4"/>
      <text x="18" y="12" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">inline SVG</text>
    </g>
    <g transform="translate(176, 192)">
      <circle cx="8" cy="8" r="3" fill="#7ee787" opacity="0.4"/>
      <text x="18" y="12" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">restrained</text>
    </g>
    <g transform="translate(176, 288)">
      <circle cx="8" cy="8" r="3" fill="#7ee787"/>
      <text x="18" y="12" font-family="-apple-system, sans-serif" font-size="10" fill="#7ee787">one .html file</text>
    </g>
  </g>
</svg>
